<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=overlays-content`: the soft keyboard sits OVER the app
         and never resizes it, the way a native app behaves. Chrome Android's
         default (`resizes-content`) shrinks the LAYOUT viewport — and with it
         `dvh` — as the keyboard animates, so the 100dvh app column was squeezed
         upward and the whole screen reflowed under the user's eye. iOS Safari has
         no such mode: it shrinks only the VISUAL viewport and leaves the layout
         alone, which is the behaviour we want on both. So this key lines Chrome up
         with Safari, and ONE JS path serves both — `use-keyboard-viewport`
         publishes the keyboard's overlap as `--keyboard-inset`, the dock rides
         above it on a compositor transform, and the scroll regions reserve the
         covered strip as extra scroll room instead of the page reflowing. Every
         surface in the app is affected, not just the primary screen; the ordinary
         document-scrolling pages (dashboard, signup, landing) get what they have
         always had on iOS — the browser scrolls the focused field into view. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content"
    />
    <!-- Deploy-rollover recovery (bootstrap). MUST run before the hashed entry
         module/CSS Vite injects into <head>: if one of those 404s (a stale shell
         after a deploy, no SW to recover), src/asset-recovery.ts never runs, so
         the reload must be armed here first. A capture-phase listener catches the
         non-bubbling resource error and force-reloads once onto the current
         build's shell, guarded by the same sessionStorage key the module uses so
         the two never reload-storm each other. Keep in sync with
         src/asset-recovery.ts (RELOAD_GUARD_KEY / the 10000ms window). -->
    <script>
      (function () {
        var GUARD = 'kiln:asset-recovery-reloaded-at';
        var MIN_INTERVAL_MS = 10000;
        function isHashedAsset(url) {
          try {
            var u = new URL(url, location.origin);
            return u.origin === location.origin && u.pathname.indexOf('/assets/') === 0;
          } catch (e) {
            return false;
          }
        }
        function recover() {
          try {
            var last = parseInt(sessionStorage.getItem(GUARD) || '', 10);
            if (!isNaN(last) && Date.now() - last < MIN_INTERVAL_MS) return;
            sessionStorage.setItem(GUARD, String(Date.now()));
          } catch (e) {
            // storage unavailable — still attempt a single reload below
          }
          location.reload();
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            var url =
              el && el.tagName === 'LINK' ? el.href : el && el.tagName === 'SCRIPT' ? el.src : null;
            if (url && isHashedAsset(url)) recover();
          },
          true,
        );
      })();
    </script>
    <!-- Default system-chrome colour: the light paper surface (--surface-page,
         docs/ui/Kiln Colors.html), so the installed PWA's status bar and
         safe-area strips read as the app's own surface. `ThemeColorSync`
         (src/theme.ts) rewrites this at runtime to the active theme's surface —
         dark on /debug and when the OS prefers dark. Fonts are self-hosted via
         @fontsource variable packages (imported in main.tsx), so there are no
         external font links here. -->
    <meta name="theme-color" content="#faf6ef" />
    <!-- Static web app manifest (mobile-first PWA, 02 §11): installability + the
         launch splash. Formerly generated by vite-plugin-pwa; now a plain public/
         asset since the app ships its own static service worker for notifications
         (02 §10). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/kiln-app-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kiln</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
